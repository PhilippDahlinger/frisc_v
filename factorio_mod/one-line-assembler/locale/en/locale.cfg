[entity-description]
register-display=Wire it to the register memory cell. Opening it shows all registers x0-x31 (decimal, hex, binary). x1-x31 are the first 31 Logistics signals (wooden chest ... rail ramp).
one-line-assembler=Assembles one RISC-V (RV32IMB) instruction and outputs its machine code as a signed 32-bit integer on signal D. The instruction is stored in the combinator description.

[item-description]
register-display=Shows the FRISC-V register file of the memory cell it is wired to.
one-line-assembler=Assembles one RISC-V (RV32IMB) instruction and outputs its machine code as a signed 32-bit integer on signal D.

[mod-name]
one-line-assembler=FRISC-V Debug Tools

[mod-description]
one-line-assembler=Debug tools for the FRISC-V CPU: One line assembler (instruction -> signal D) and Register display (register file viewer).
